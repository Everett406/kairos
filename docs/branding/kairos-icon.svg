<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1D2D50"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.18" r="0.95">
      <stop offset="0" stop-color="#3B6EF5" stop-opacity="0.26"/>
      <stop offset="0.55" stop-color="#3B6EF5" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#3B6EF5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.13"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#A8C5FF"/>
      <stop offset="1" stop-color="#3B6EF5"/>
    </linearGradient>
    <radialGradient id="moment" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#FFD89B"/>
      <stop offset="1" stop-color="#FF9E43"/>
    </radialGradient>
    <radialGradient id="momentGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFAF52" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FFAF52" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 玻璃底 -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#tile)"/>
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#glow)"/>
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#sheen)"/>
  <rect x="25.5" y="25.5" width="461" height="461" rx="106.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="3"/>

  <g transform="translate(10 10)">
    <!-- 钟面暗环 -->
    <circle cx="176" cy="240" r="116" fill="none" stroke="#A8C5FF" stroke-opacity="0.14" stroke-width="10"/>

    <!-- K：竖笔 + 两根指针 -->
    <rect x="159" y="152" width="34" height="208" rx="17" fill="url(#mark)"/>
    <g stroke="url(#mark)" stroke-linecap="round" fill="none">
      <path d="M176 240 L312 150" stroke-width="30"/>
      <path d="M176 240 L334 354" stroke-width="34"/>
    </g>

    <!-- 轴心 -->
    <circle cx="176" cy="240" r="24" fill="url(#mark)"/>
    <circle cx="176" cy="240" r="8" fill="#0D1526"/>

    <!-- 那一刻 -->
    <circle cx="340" cy="120" r="34" fill="url(#momentGlow)"/>
    <circle cx="340" cy="120" r="14" fill="url(#moment)"/>
  </g>
</svg>
