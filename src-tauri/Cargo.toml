[package]
name = "kairos"
version = "0.4.1"
description = "Kairos - liquid glass desktop assistant"
authors = ["At210Co60"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "query", "gzip", "form"] }
sysinfo = "0.33"
base64 = "0.22"
chrono = "0.4"
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
wmi = "0.17"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Security",
  "Win32_System_Threading",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
